name: Verify Iron Legion
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke:transport
      - run: npm run smoke:workflow
      - run: npm audit
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npx playwright install --with-deps chromium
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run test:ui
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-${{ matrix.os }}-${{ matrix.node }}
          path: |
            playwright-report/
            test-results/
